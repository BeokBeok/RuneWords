name: Pull Request

on:
  pull_request:

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          VERSION_FILE=build-logic/convention/src/main/java/plugin/AndroidApplicationConventionPlugin.kt
          BUILD_PATTERN='\.kts?$|(^|/)src/|^gradle/libs\.versions\.toml$|^gradle/wrapper/|^gradle\.properties$|^gradlew$|^config/detekt\.yml$|^\.editorconfig$'
          VERSION_NAME_LINE_PATTERN='^[+-][[:space:]]*private const val (MAJOR|MINOR|PATCH)_VERSION = [0-9]+$'

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          # 버전 이름 상수 줄만 바뀌었으면 VERSION_FILE을 변경 목록에서 뺀다.
          OTHER_LINES=$(git diff -U0 "$BASE_SHA...$HEAD_SHA" -- "$VERSION_FILE" \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | grep -vE "$VERSION_NAME_LINE_PATTERN" || true)
          if [ -z "$OTHER_LINES" ]; then
            CHANGED_FILES=$(echo "$CHANGED_FILES" | grep -vxF "$VERSION_FILE" || true)
          fi

          if echo "$CHANGED_FILES" | grep -qE "$BUILD_PATTERN"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # build는 main ruleset의 required check이므로 workflow가 아닌 job 단계에서 건너뛴다.
  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest

    steps:        
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > ./app/google-services.json

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Check detekt
        run: ./gradlew detekt

      - name: Run Coverage
        run: ./gradlew jacocoTestReport

      - name: Jacoco Report to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: |
            ${{ github.workspace }}/**/build/reports/jacoco/**/jacocoTestDebugUnitTestReport.xml
          token: ${{ secrets.JACOCO_TOKEN }}
