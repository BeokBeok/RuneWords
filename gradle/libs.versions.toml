[versions]
jUnit5 = "5.11.0"
hilt = "2.60.1"
coroutines = "1.11.0"
kotlin = "2.4.10"
gradle = "9.0.1"
jacoco = "0.8.7"
room = "2.7.1"
ksp = "2.3.12"

[libraries]
core-ktx = { module = "androidx.core:core-ktx", version = "1.16.0" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.0.1" }
material = { module = "com.google.android.material:material", version = "1.12.0" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version = "23.3.0" }
play-update-ktx = { module = "com.google.android.play:app-update-ktx", version = "2.1.0"}
play-review-ktx = { module = "com.google.android.play:review-ktx", version = "2.0.1"}
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version = "0.3.7" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version = "2.14" }

# Test
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "jUnit5" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "jUnit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version = "3.26.3" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
konsist = { module = "com.lemonappdev:konsist", version = "0.17.1" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version = "2025.05.01" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material = { module = "androidx.compose.material:material" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version = "1.1.1" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.9.0" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version = "2.9.0" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version = "33.14.0" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-perf = { module = "com.google.firebase:firebase-perf" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }
firebase-appcheck = { module = "com.google.firebase:firebase-appcheck" }
firebase-appcheck-debug = { module = "com.google.firebase:firebase-appcheck-debug" }

timber = { module = "com.jakewharton.timber:timber", version = "5.0.1" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version = "1.2.0" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Gradle
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version = "1.23.8" }
ksp-gradle = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
compose-compiler-gradle = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Benchmark
junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version = "1.3.0" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-common = { module = "androidx.room:room-common", version.ref = "room" }

# Kotlinx-serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }

# app startup
startup-runtime = { module = "androidx.startup:startup-runtime", version = "1.1.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "gradle" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-junit5 = { id = "de.mannodermaus.android-junit5", version = "2.0.1" }
google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.3" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "11.6.1" }
appdistribution = { id = "com.google.firebase.appdistribution", version = "5.3.0" }
firebase-perf = { id = "com.google.firebase.firebase-perf", version = "2.0.2" }
detekt = { id = "io.gitlab.arturbosch.detekt", version = "1.23.8" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-guard = { id = "com.joetr.compose.guard", version = "2.0.0" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version = "3.19.2" }

# Plugins defined by this project
runewords-android-application-compose = { id = "runewords.android.application.compose", version = "unspecified" }
runewords-android-application = { id = "runewords.android.application", version = "unspecified" }
runewords-android-library-compose = { id = "runewords.android.library.compose", version = "unspecified" }
runewords-android-library = { id = "runewords.android.library", version = "unspecified" }
runewords-android-application-firebase = { id = "runewords.android.application.firebase", version = "unspecified" }
runewords-android-hilt = { id = "runewords.android.hilt", version = "unspecified" }
runewords-android-junit = { id = "runewords.android.junit", version = "unspecified" }
runewords-android-benchmark = { id = "runewords.android.benchmark", version = "unspecified" }
runewords-android-detekt = { id = "runewords.android.detekt", version = "unspecified" }
runewords-android-application-jacoco = { id = "runewords.android.application.jacoco", version = "unspecified" }
runewords-android-library-jacoco = { id = "runewords.android.library.jacoco", version = "unspecified" }
runewords-android-library-room = { id = "runewords.android.library.room", version = "unspecified" }
runewords-android-kotlinx-serialization = { id = "runewords.android.kotlinx.serialization", version = "unspecified" }
runewords-android-feature = { id = "runewords.android.feature", version = "unspecified" }

[bundles]
compose = [
    "compose-ui",
    "compose-material",
    "compose-ui-tooling"
]
